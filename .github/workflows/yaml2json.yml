name: 📝 Convert YAML to JSON

on:
  push:
    paths: ['QUERIES.yaml']
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["🌥 Sync queries from Public Templates"]
    types:
      - completed
    branches:
      - main

jobs:
  build:
    # A workflow_run start is accepted only from a successful scheduled or
    # manual run of the update workflow on main of this repository.
    if: >-
      github.event_name != 'workflow_run' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.path == '.github/workflows/syncqueries.yml' &&
        (github.event.workflow_run.event == 'schedule' || github.event.workflow_run.event == 'workflow_dispatch')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - run: pip3 install pyyaml --user

      - name: Convert YAML to JSON
        run: cat QUERIES.yaml | python3 .github/scripts/yaml2json.py > QUERIES.json

      - name: Commit and push changes
        run: |
          [[ "$(git status -s | wc -l)" == 0 ]] && exit 0

          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          COMMIT_MSG="build: "
          [[ "${{ github.event_name }}" == "workflow_dispatch" ]] && COMMIT_MSG+="[force] "
          COMMIT_MSG+="compile JSON [$(date "+%d/%m/%Y %T")] :robot:"

          git commit -am "${COMMIT_MSG}"
          git push origin "${GITHUB_REF_NAME}"
